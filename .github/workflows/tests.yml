name: 测试

# 每次 push / PR 都跑单元测试,防止改坏(发布流水线另外在 Windows 上跑一遍)
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Qt 运行库(界面无头冒烟测试需要)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 \
                                     libdbus-1-3 libfontconfig1

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyzipper py7zr rarfile send2trash \
                      openpyxl python-docx pdfplumber xlrd xlwt olefile \
                      PySide6

      - name: 运行单元测试(含界面无头冒烟)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
