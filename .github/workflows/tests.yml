name: 测试

# 每次 push / PR 都跑单元测试,防止改坏(发布流水线另外在 Windows 上跑一遍)
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装测试依赖(核心逻辑不需要 PySide6)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyzipper py7zr rarfile send2trash \
                      openpyxl python-docx pdfplumber xlrd xlwt olefile

      - name: 运行单元测试
        run: python -m pytest tests/ -q
