name: 构建发布

# 推送 v* 标签自动构建 Windows exe 并发布 Release;
# 也可手动触发:填 tag(如 v2.0.0)则构建后自动建标签并发布,不填只出构建产物
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签(如 v2.0.0;留空则只构建不发布)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest -r requirements.txt

      - name: 在 Windows 上跑单元测试
        shell: bash
        run: python -m pytest tests/ -q

      - name: PyInstaller 打包
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # GitHub Release 附件名会剥掉中文字符,故 exe 用英文名,下载后可自行重命名
          NAME="FileAutoClassifier-${RELEASE_TAG:-${GITHUB_REF_NAME:-dev}}"
          pyinstaller --onefile --windowed --name "$NAME" \
            --icon app.ico --add-data "app.ico;." --add-binary "UnRAR.exe;." \
            --collect-submodules py7zr --collect-submodules rarfile \
            --collect-submodules pyzipper --collect-submodules send2trash \
            --collect-submodules openpyxl \
            --collect-all ttkbootstrap --collect-all tkinterdnd2 \
            --hidden-import multivolumefile --hidden-import inflate64 \
            --hidden-import pybcj --hidden-import pyppmd \
            文件自动分类工具.py
          ls -l dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
          body: |
            Windows 免安装单文件版:下载下方 exe,拷到任意 Windows 电脑双击即用,
            无需安装 Python 或 WinRAR。下载后可重命名为「文件自动分类工具.exe」。

            - 双击运行 = 图形界面;命令行带参数运行 = 无界面批处理(`-h` 查看用法)
            - 详细功能与用法见仓库中的《使用说明.md》
